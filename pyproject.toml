[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "overpunch"
version = "0.1.0"
description = "Decode mainframe fixed-width extracts from their COBOL copybooks, and find the traps that silently corrupt them."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
keywords = ["cobol", "copybook", "ebcdic", "mainframe", "packed-decimal", "nemotron", "data-quality"]
dependencies = []

[project.optional-dependencies]
parquet = ["pyarrow>=14"]
dev = ["pytest>=7"]
scans = ["Pillow>=10"]   # only to MANUFACTURE a demo scan, never to use one

[project.scripts]
overpunch = "overpunch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
